{# _hero.html
   Usage:
     {% from "partials/_hero.html" import hero %}
     {% call hero("home") %}   ← info card HTML  {% endcall %}
     {% call hero("service") %} ← form HTML      {% endcall %}
#}
{% macro hero(page_name) %}
<section class="hero">

    <!-- ① Navbar with speech-bubble tail -->
    <div class="navbar-wrap">
        <nav class="navbar" aria-label="Main navigation">
            <a href="{{ url_for('home') }}"    {% if page_name=='home'    %}class="active"{% endif %}>Home</a>
            <a href="{{ url_for('service') }}" {% if page_name=='service' %}class="active"{% endif %}>Service</a>
            <a href="{{ url_for('action') }}"  {% if page_name=='action'  %}class="active"{% endif %}>Action</a>
            <a href="{{ url_for('about') }}"   {% if page_name=='about'   %}class="active"{% endif %}>About</a>
            <span class="nav-arrow" aria-hidden="true">&#9658;</span>
        </nav>
        <!-- downward speech-bubble triangle -->
        <div class="speech-tail" aria-hidden="true"></div>
    </div>

    <!-- ② Full-width giant heading -->
    <div class="heading-area">
        <h1 class="hero-heading">
            <span class="line1">WHAT'S INSIDE</span>
            <span class="line2">THE FOLDER</span>
        </h1>
        <!-- decorative pixel cursor -->
        <div class="cursor-icon" aria-hidden="true">
            <svg width="28" height="34" viewBox="0 0 28 34" fill="none">
                <path d="M2 2L2 28L8.5 21.5L13.5 32L17 30L12 19.5L21 19.5Z"
                      fill="#b9dcf7" stroke="white" stroke-width="2.5"
                      stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <!-- ③ Sub-content slot (info card for home, form for service) -->
    <div class="hero-sub {{ 'hero-sub--right' if page_name=='home' else 'hero-sub--left' }}">
        {{ caller() }}
    </div>

    <!-- ④ Photo stack + blue folder pocket -->
    <div class="bottom-section">
        <div class="photo-stack">
            <img src="{{ url_for('static', filename='images/photo1.jpeg') }}"
                 class="photo" alt="Photo 1">
            <img src="{{ url_for('static', filename='images/photo2.jpeg') }}"
                 class="photo" alt="Photo 2">
            <img src="{{ url_for('static', filename='images/photo3.jpeg') }}"
                 class="photo" alt="Photo 3">
        </div>
        <div class="folder-pocket" aria-hidden="true"></div>
    </div>

</section>
{% endmacro %}
